name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install ruff black

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Black check
        run: black --check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests pytest pyyaml

      - name: Run tests
        run: pytest tests/ -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."

  notify-kb:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Notify ats-kb-automation
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GH_ORG_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/reversinglabs-ats/ats-kb-automation/dispatches \
            -d '{"event_type":"repo-updated","client_payload":{"repo":"${{ github.event.repository.name }}"}}'
